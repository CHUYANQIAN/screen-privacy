<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">屏幕遮蔽，调试继续</title>
  <desc id="description">ScreenPrivacy 0.3.0 的抽象宣传图。为 AI 桌面调试提供临时防旁观遮蔽，自定义全局快捷键恢复。右侧显示器为抽象图示，不是实测画面。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F7FA"/><stop offset="1" stop-color="#EAF0FB"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172235"/><stop offset="1" stop-color="#0D1421"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <path d="M0 0H1280V12H0Z" fill="#2463D2"/>
  <g font-family="Microsoft YaHei UI, Noto Sans CJK SC, PingFang SC, sans-serif">
    <text x="64" y="91" font-size="23" font-weight="600" letter-spacing="1.2" fill="#2463D2">ScreenPrivacy · 屏幕遮蔽</text>
    <rect x="64" y="120" width="333" height="38" rx="19" fill="#E1EAFB"/>
    <text x="84" y="145" font-size="17" fill="#244E96">0.3.0 · 界面示意</text>
    <text x="64" y="236" font-size="58" font-weight="700" fill="#182230">屏幕遮蔽，</text>
    <text x="64" y="309" font-size="58" font-weight="700" fill="#182230">调试继续。</text>
    <text x="66" y="367" font-size="24" fill="#5C6777">为 AI 桌面调试提供临时防旁观遮蔽</text>
    <text x="66" y="420" font-size="21" fill="#2463D2">主屏与副屏组 · 自定义全局快捷键恢复</text>
    <rect x="66" y="465" width="480" height="1" fill="#CCD7E6"/>
    <text x="66" y="509" font-size="20" fill="#182230">减少现场旁观，桌面内容仍对 Codex 可见。</text>
    <text x="66" y="576" font-size="17" fill="#5C6777">Windows 工具 · 兼容范围以使用环境为准</text>
    <g transform="translate(720 183)">
      <rect x="0" y="0" width="460" height="266" rx="19" fill="#FFFFFF" stroke="#CAD6E7" stroke-width="3"/>
      <rect x="18" y="18" width="424" height="230" rx="9" fill="url(#screen)"/>
      <path d="M205 268V302M160 305H300" stroke="#94A6BF" stroke-width="13" stroke-linecap="round"/>
      <rect x="250" y="143" width="244" height="164" rx="13" fill="#FFFFFF" stroke="#CAD6E7" stroke-width="3"/>
      <rect x="264" y="157" width="216" height="136" rx="5" fill="#101828"/>
      <path d="M356 309V333M325 336H390" stroke="#94A6BF" stroke-width="9" stroke-linecap="round"/>
      <circle cx="229" cy="123" r="20" fill="#152F54" stroke="#4F86E9" stroke-width="2"/>
      <path d="M217 123H241" stroke="#91B9FF" stroke-width="3" stroke-linecap="round"/>
      <text x="230" y="385" text-anchor="middle" font-size="18" fill="#5C6777">抽象图示，非实测画面</text>
    </g>
  </g>
</svg>
